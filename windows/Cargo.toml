[package]
name = "radial-switcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Radial window switcher for Windows"
publish = false

[[bin]]
name = "RadialSwitcher"
path = "src/main.rs"

[dependencies]
radial-core = { path = "../core" }
tiny-skia = "0.11"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
