name: Linux build

on:
  push:
    paths:
      - "linux/**"
      - "core/**"
      - ".github/smoke-test.sh"
      - ".github/wayland-smoke-test.sh"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Test shared core
        working-directory: core
        run: cargo test --release

      - name: Test Linux app
        working-directory: linux
        run: cargo test --release

      - name: Lint
        working-directory: linux
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build
        working-directory: linux
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: radial-switcher-linux
          path: linux/target/release/radial-switcher
          if-no-files-found: error

      - name: Smoke test on a virtual X11 desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xcompmgr xterm x11-apps xdotool imagemagick x11-xserver-utils fonts-dejavu-core at-spi2-core dbus-x11 > /dev/null
          firefox --version || true
          dbus-run-session -- bash -eux .github/smoke-test.sh

      - name: Smoke test on a headless Wayland compositor (Sway)
        if: always()
        run: |
          sudo apt-get install -y -qq sway foot grim wlrctl wtype jq > /dev/null
          bash -eux .github/wayland-smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-test
          path: shots/
